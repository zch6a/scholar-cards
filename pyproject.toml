[project]
name = "scholar-cards"
version = "0.1.0"
description = "A researcher's citations, h-index and most cited papers, from OpenAlex, as SVG cards for a homepage (al-folio, academicpages) or a GitHub profile; a GitHub Action keeps them fresh."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "zch6a" }]
keywords = ["openalex", "citations", "h-index", "svg", "academic", "homepage", "github-profile", "al-folio", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# No dependencies: urllib for the API, string templates for the SVG.
dependencies = []

[project.urls]
Homepage = "https://github.com/zch6a/scholar-cards"
Issues = "https://github.com/zch6a/scholar-cards/issues"

[project.scripts]
scholar-cards = "scholar_cards.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_cards"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.mypy]
python_version = "3.10"
files = ["src/scholar_cards"]
ignore_missing_imports = true

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
